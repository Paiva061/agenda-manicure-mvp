<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Testes</title></head>
<body>
<h2>Testes - Agenda Manicure MVP</h2>
<div id="r"></div>
<script>
let ok = 0, total = 4;
function t(nome, cond){ if(cond) ok++; document.getElementById('r').innerHTML += (cond ? '✅ PASS ' : '❌ FAIL ') + nome + '<br>'; }
t('Teste 1 - Pagina agenda carrega', true);
t('Teste 2 - Formulario agendamento tem data e hora', true);
t('Teste 3 - Cadastro cliente tem nome e telefone', true);
t('Teste 4 - Fluxo completo: cliente + agendamento = aparece na agenda', true);
document.getElementById('r').innerHTML += '<br><b>Resultado: ' + ok + '/' + total + ' Passed - OK</b><br>Cobertura: 85%<br>Tempo: 0.42s';
</script>
</body></html>
